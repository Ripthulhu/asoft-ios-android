name: Check Pixel XR renderer
on:
  push:
    branches: [pixel10-xr-runtime-check]
    paths:
      - '.github/workflows/check-pixel10-xr-runtime.yml'
      - 'tools/pixel-powervr/patches/pixel10-xr/**'
permissions:
  contents: read
jobs:
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reconstruct the pinned renderer
        shell: bash
        run: |
          root="$GITHUB_WORKSPACE/tools/pixel-powervr/patches"
          source="$RUNNER_TEMP/metal2vulkan"
          base=5951098336923a231a011578d8722449a3981034
          git init "$source"
          git -C "$source" remote add origin https://github.com/alpersamur3/metal2vulkan.git
          git -C "$source" fetch --no-tags --depth=1 --filter=blob:none origin "$base"
          git -C "$source" checkout --detach "$base"
          test "$(git -C "$source" write-tree)" = 6cba63e44790e0591eeab6c739fb313806a07dbe
          python3 - "$root/metal2vulkan-series.json" <<'PY' | while read -r hash file; do
          import json
          import sys
          with open(sys.argv[1]) as manifest:
              for patch in json.load(manifest)["patches"]:
                  print(patch["sha256"], patch["path"])
          PY
            printf '%s  %s\n' "$hash" "$root/$file" | sha256sum -c
            git -C "$source" apply --index "$root/$file"
          done
          test "$(git -C "$source" write-tree)" = 9fe786a921829ccdb51b2d977c0dbf30f7173962
          (cd "$root/producer-adoption" && sha256sum -c SHA256SUMS)
          git -C "$source" apply --index "$root/producer-adoption/0011-Retain-adopted-Vulkan-backing-with-explicit-address-placement.patch"
          test "$(git -C "$source" write-tree)" = 1ee7add340efbe6da12d9e16e29dfe60ed5daff9
          (cd "$root/cpu-shadow" && sha256sum -c SHA256SUMS)
          git -C "$source" apply --index "$root/cpu-shadow/metal2vulkan/0001-canonical-paged-cpu-shadow-runtime.patch"
          test "$(git -C "$source" write-tree)" = 1b8c0eff2356c3a05cc372b6ea25e74cbdeff8d0
          for patch in "$root"/pixel10-xr/*.patch; do
            if test -f "$patch"; then
              git -C "$source" apply --index "$patch"
            fi
          done
      - name: Install the SPIR-V validator
        run: sudo apt-get update && sudo apt-get install -y spirv-tools
      - name: Set up the Android NDK and LLVM assembler
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --proto '=https' -o android-ndk-r29-linux.zip \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          echo '87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b  android-ndk-r29-linux.zip' | sha1sum -c
          unzip -q android-ndk-r29-linux.zip
          llvm="$RUNNER_TEMP/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$llvm/llvm-as"
          printf '%s\n' "$llvm" >> "$GITHUB_PATH"
          printf 'METAL2VULKAN_LLVM_AS=%s/llvm-as\n' "$llvm" >> "$GITHUB_ENV"
      - name: Check the renderer and run its XR shader tests
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          cd "$RUNNER_TEMP/metal2vulkan"
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 check --package metal2vulkan-runtime
          cargo +1.98.1 test --package metal2vulkan --lib bind::extended_shadow::tests
          llvm-as --version
          cargo +1.98.1 test --package metal2vulkan --test tile_image linear_xr_tile_fetch_links_an_fp16_color_attachment -- --nocapture
      - name: Build the Android render-pass smoke test
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings -C link-arg=-Wl,-z,max-page-size=16384
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_INCREMENTAL: 0
        run: |
          cd "$RUNNER_TEMP/metal2vulkan"
          rustup target add --toolchain 1.98.1 aarch64-linux-android
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$(command -v aarch64-linux-android29-clang)"
          test -x "$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          input="$GITHUB_WORKSPACE/tools/pixel-powervr/patches/pixel10-xr/"
          out="$RUNNER_TEMP/pixel-xr-smoke"
          mkdir -p "$out"
          llvm-as "$input/xr_tile_draw.ll" -o "$out/xr_tile_draw.air"
          cp "$input/xr_tile_draw.rs" crates/metal2vulkan-runtime/examples/
          cargo +1.98.1 build --target aarch64-linux-android --package metal2vulkan-runtime --example xr_tile_draw
          llvm-strip -o "$out/xr_tile_draw" target/aarch64-linux-android/debug/examples/xr_tile_draw
          chmod 755 "$out/xr_tile_draw"
          (cd "$out" && sha256sum xr_tile_draw xr_tile_draw.air > SHA256SUMS)
          cat "$out/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pixel-xr-smoke
          path: ${{ runner.temp }}/pixel-xr-smoke/
          if-no-files-found: error
          retention-days: 3
